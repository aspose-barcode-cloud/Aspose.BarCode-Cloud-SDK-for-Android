name: Build Android App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android app
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Java 17 for AGP
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - uses: sparkfabrik/android-build-action@22a550b5d2dff5538ee6bbc39ba8517fdb3620b3 # v1.5.0
        with:
          project-path: ${{ github.workspace }}
          fastlane-env: "release"
          ruby-version: "3.3"
          bundler-version: "2.4.22"
          # Pin fastlane >= 2.236.0, which adds multi_json as a direct dep.
          # The action's default (2.213.0) crashes with
          # "multi_json is not part of the bundle" on load.
          fastlane-version: "2.236.1"
